<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 id="title">読書録サイト</h1>
  
  <button id="loginBtn">ログイン</button>
  <div id="loginForm">
    <input id="userName" placeholder="ユーザー名">
    <input id="loginPass" type="password" placeholder="パスワード">
    <button id="loginExecBtn">ログイン実行</button>
    <button id="goTop1">トップへ戻る</button>
  </div>


  <button id="registerBtn">新規登録</button>
  <div id="registerForm">
    <input id="registerName" placeholder="名前">
    <input id="registerPassword" type="text" placeholder="パスワード" pattern="[A-Za-z0-9]+">
    <button id="registerExecBtn">登録</button>
    <button id="goTop2">トップへ戻る</button>
  </div>


  <p id="registerResult"></p>


 

  <p id="loginResult"></p>

  <script src="script.js"></script>
</body>
</html>
